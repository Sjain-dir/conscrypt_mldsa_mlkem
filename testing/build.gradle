plugins {
    id 'conventions.common'
    id 'conventions.jvm'
    alias libs.plugins.shadow
}

description = 'Conscrypt: Testing'

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

dependencies {
    compileOnly project(':conscrypt-constants')

    implementation libs.bouncycastle.apis,
            libs.bouncycastle.provider,
            libs.junit
}

dependencies {
    implementation "org.bouncycastle:bcprov-jdk18on:1.81.1"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.81.1"
}
// No public methods here.
tasks.withType(Javadoc).configureEach {
    enabled = false
}

tasks.register("runMlDsaExplicitProviderDetection", JavaExec) {
    group = "verification"
    description = "Runs the ML-DSA explicit-provider detection reproduction"

    classpath = sourceSets.main.runtimeClasspath
    mainClass.set(
        "org.conscrypt.java.security.PqcKeyGenerationTest"
    )
}

tasks.register("runPqcKeyGeneration", JavaExec) {
    group = "verification"
    description = "Runs the PQC key-generation reproduction program"

    classpath = sourceSets.main.runtimeClasspath
    mainClass.set("org.conscrypt.java.security.PqcKeyGenerationTest")
}
